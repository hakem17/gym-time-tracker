<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-title" content="Gym Time">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Gym Time Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Apple-Fitness-style dark theme: black canvas, grouped cards, ring colours carry meaning */
:root{
  color-scheme:dark;
  --bg:#000;--card:#1C1C1E;--card2:#2C2C2E;--sep:#38383A;
  --ink:#FFFFFF;--muted:#9C9CA3;--faint:#636366;
  --move:#FA114F;      /* workouts */
  --exercise:#A6FF00;  /* cardio */
  --stand:#1EEAEF;     /* abs */
  --ok:#30D158;--warn:#FF9F0A;
  --series:#1EEAEF;
  --plate:var(--move);--line:var(--sep);--surface:var(--card);--late:var(--warn);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Rubik","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.45;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(120px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.hidden{display:none!important}
h1,h2,h3{margin:0;line-height:1.2}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--stand);outline-offset:2px;border-radius:8px}

/* large title header */
.lt{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px 0 14px}
.lt h1{font-size:34px;font-weight:800}
.lt .date{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:2px}
.ibtn{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none}
.ibtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sect-t{font-size:22px;font-weight:700;margin:26px 0 10px}
.card{background:var(--card);border-radius:18px;padding:16px}
.card+.card{margin-top:12px}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:12px 22px;font-weight:700;font-size:17px}
.pill.move{background:var(--move);color:#fff}
.pill.gray{background:var(--card2);color:var(--ink)}
.pill.block{display:flex;width:100%}

/* rings */
.rings{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.rings svg{width:150px;height:150px;transform:rotate(-90deg)}
.rings .trk{fill:none;stroke-width:17;opacity:.24}
.rings .arc{fill:none;stroke-width:17;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){.rings .arc{transition:none}}
.rl{display:grid;gap:10px}
.rl .k{font-size:15px;font-weight:600}
.rl .v{font-size:26px;font-weight:700;line-height:1.1}
.rl .v small{font-size:15px;font-weight:600}
.c-move{color:var(--move)}.c-ex{color:var(--exercise)}.c-stand{color:var(--stand)}

/* next workout */
.next{margin-top:12px}
.next .lbl{font-size:15px;font-weight:600;color:var(--move)}
.next b{display:block;font-size:42px;font-weight:800;line-height:1.05;margin:4px 0 2px}
.next .sub{color:var(--muted);font-size:15px}
.next .go{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.days2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.dmini{background:var(--card);border-radius:18px;padding:14px;text-align:right}
.dmini b{display:block;font-size:22px;font-weight:700}
.dmini span{font-size:13px;color:var(--muted)}
.grouped{background:var(--card);border-radius:18px;overflow:hidden}
.grouped>*{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px 16px;text-align:right;position:relative}
.grouped>*+*::before{content:"";position:absolute;top:0;right:16px;left:0;border-top:1px solid var(--sep)}
.grouped .t{font-weight:600}
.grouped .s{display:block;font-size:14px;color:var(--muted)}
.chev{color:var(--faint);font-size:22px;line-height:1}

/* setup sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--card);border-radius:22px 22px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.grab{width:40px;height:5px;border-radius:3px;background:var(--faint);margin:0 auto 12px}
.sheet h2{font-size:26px;font-weight:800}
.opts{margin:14px 0;background:var(--card2);border-radius:14px;overflow:hidden}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px;font-size:16px;position:relative;text-align:right}
.opt+.opt::before{content:"";position:absolute;top:0;right:14px;left:0;border-top:1px solid var(--sep)}
.sw{width:51px;height:31px;border-radius:16px;background:var(--faint);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:2px;right:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s}
.opt[aria-checked="true"] .sw{background:var(--ok)}
.opt[aria-checked="true"] .sw::after{transform:translateX(-20px)}
.seg2{display:flex;background:var(--card2);border-radius:10px;padding:2px;margin:6px 0 16px}
.seg2 button{flex:1;padding:8px 4px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:#636366;color:#fff}

/* session */
.shead{position:sticky;top:0;z-index:15;background:rgba(0,0,0,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  margin:-12px -16px 0;padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.shead .ttl{font-size:17px;font-weight:700}
.shead .clk{font-size:30px;font-weight:700;color:var(--exercise);line-height:1}
.shead .stat{font-size:13px;color:var(--muted)}
.shead .stat.late{color:var(--warn)}
.ex{background:var(--card);border-radius:18px;padding:14px 12px 8px;margin-top:12px;scroll-margin-top:84px}
.ex.cur{box-shadow:0 0 0 2px var(--move) inset}
.ex.doneall{opacity:.6}
.exh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.exh h3{font-size:19px;font-weight:700}
.tag{font-size:12px;font-weight:600;color:var(--muted);background:var(--card2);border-radius:6px;padding:2px 7px;white-space:nowrap}
.goal{margin-top:6px;font-size:15px;font-weight:600;color:var(--move)}
.hintl{font-size:13px;color:var(--muted);margin-top:2px}
.sets{width:100%;border-collapse:separate;border-spacing:0 6px;margin-top:6px}
.sets th{font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding:0 2px}
.sets td{text-align:center;padding:0 2px}
.sets td.n{width:26px;font-weight:700;color:var(--muted)}
.sets td.prev{font-size:13px;color:var(--faint);width:70px}
.sets input{width:100%;max-width:86px;height:46px;border-radius:10px;border:0;background:var(--card2);text-align:center;font-size:20px;font-weight:600}
.sets input:focus{outline:2px solid var(--stand)}
.chk{width:46px;height:46px;border-radius:10px;background:var(--card2);display:grid;place-items:center;margin:0 auto}
.chk svg{width:22px;height:22px;stroke:var(--faint);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
tr.done input{background:rgba(48,209,88,.18)}
tr.done .chk{background:var(--ok)}
tr.done .chk svg{stroke:#000}
.exf{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lnk{padding:10px 4px;font-size:15px;font-weight:600;color:var(--stand)}
.lnk.dim{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.chip{padding:8px 14px;border-radius:999px;background:var(--card2);font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:#000}
.timed{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 6px}
.timed .big{font-size:26px;font-weight:700}
.endrow{margin-top:22px;display:grid;gap:6px}

/* rest bar */
.rest{position:fixed;inset:auto 0 0 0;z-index:30;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px))}
.rest .in{max-width:536px;margin:0 auto;background:#2C2C2E;border-radius:22px;padding:12px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.7)}
.rest .ring{width:54px;height:54px;flex:none;transform:rotate(-90deg)}
.rest .ring circle{fill:none;stroke-width:6}
.rest .ring .t{stroke:var(--sep)}
.rest .ring .p{stroke:var(--exercise);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.rest .mid{flex:1;min-width:0}
.rest .lab{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest .cd{font-size:32px;font-weight:700;line-height:1}
.rest .rb{width:44px;height:44px;border-radius:50%;background:var(--card);font-weight:700;font-size:14px;flex:none}
.rest.flash .in{animation:fl .5s ease 3}
@keyframes fl{50%{background:#3d5410}}
@media (prefers-reduced-motion:reduce){.rest.flash .in{animation:none}}

/* summary */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border-radius:16px;padding:12px}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:700}
textarea{width:100%;min-height:220px;font-size:15px;padding:12px;border-radius:14px;border:0;background:var(--card);direction:rtl;line-height:1.6}
.edEx{padding:12px 0;border-bottom:1px solid var(--sep)}
.edHead{font-weight:700;margin-bottom:6px}
.edRow{display:flex;align-items:center;gap:6px;margin-top:6px}
.edRow input,.edRow select{max-width:86px;text-align:center;padding:8px;border-radius:10px;border:0;background:var(--card2)}
.mini{padding:8px 12px;font-size:14px;background:var(--card2);border-radius:10px;font-weight:600}

/* settings */
.tabs{display:flex;gap:6px;margin:4px 0 12px;overflow-x:auto}
.exs{border-bottom:1px solid var(--sep);padding:12px 0}
.exs:last-child{border-bottom:0}
.exhead{display:flex;align-items:center;gap:8px}
.exhead .nm{flex:1;font-weight:600}
.exhead .sm{font-size:13px;color:var(--muted);display:block;font-weight:400}
.edit{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.edit .full{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.edit input,.edit select{width:100%;font-size:16px;padding:11px 12px;border-radius:12px;border:0;background:var(--card2)}
.check{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink)}
.check input{width:20px;height:20px}
.row{display:flex;gap:10px;margin-top:10px}
.row>*{flex:1}

/* tab bar */
.tabbar{position:fixed;inset:auto 0 0 0;z-index:20;display:flex;justify-content:space-around;
  background:rgba(22,22,24,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:.5px solid var(--sep);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;max-width:110px;padding:4px 2px;font-size:11px;font-weight:600;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--move)}

/* dashboard (dash.js) */
.hl{background:var(--card);border-radius:18px;padding:16px;margin-top:12px}
.hl .kk{font-size:15px;font-weight:600;display:flex;justify-content:space-between;gap:10px}
.hl .kk .when{color:var(--muted);font-weight:400;font-size:13px}
.hl .say{font-size:19px;font-weight:600;margin:6px 0 2px;line-height:1.4}
.hl .big{font-size:34px;font-weight:700;line-height:1.1;margin-top:6px}
.hl .big small{font-size:16px;color:var(--muted);font-weight:600}
.hl .sub{font-size:14px;color:var(--muted);margin:2px 0 8px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.kpi{background:var(--card);border-radius:18px;padding:14px}
.kpi .k{font-size:14px;font-weight:600}
.kpi .v{font-size:30px;font-weight:700;line-height:1.15;margin-top:4px}
.kpi .v small{font-size:15px;font-weight:600;color:var(--muted)}
.kpi .d{font-size:13px;color:var(--muted)}
.seg{display:flex;background:var(--card);border-radius:10px;padding:2px;margin:4px 0}
.seg .chip{flex:1;background:none;border-radius:8px;padding:7px 4px;color:var(--muted);font-size:14px}
.seg .chip[aria-pressed="true"]{background:#636366;color:#fff}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px 0;border-bottom:1px solid var(--sep);font-size:15px}
.list li:last-child{border-bottom:0}
.list .num{font-weight:700}
.list small{display:block;color:var(--muted);font-size:12px}
.exrow{display:grid;grid-template-columns:1fr 84px 66px;align-items:center;gap:8px;width:100%;text-align:right;padding:12px 0;border-bottom:1px solid var(--sep);font-size:15px}
.exrow small{display:block;color:var(--muted);font-size:12px}
.exrow .chg{font-weight:700;text-align:left;direction:ltr}
.exrow svg{width:84px;height:28px}
.lvl{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;background:var(--card2)}
.lvl.strong{background:var(--ok);color:#000}
.lvl.weak{background:transparent;box-shadow:0 0 0 1.5px var(--warn) inset;color:var(--warn)}
.lvl.na{color:var(--muted)}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart .ax{font-size:11px;fill:var(--muted);font-family:inherit}
.chart .grid{stroke:var(--sep);stroke-width:1}
.chart .ref{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}
.chart .band{fill:#fff;opacity:.06}
.chart .ln{fill:none;stroke:var(--series);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--series);stroke:var(--card);stroke-width:2}
.chart .pt.hollow{fill:var(--card);stroke:var(--series)}
.chart .bar{fill:var(--series)}
.chart .bar.dim{opacity:.4}
.chart .hit{fill:transparent;cursor:pointer}
.chart .cross{stroke:var(--muted);stroke-width:1}
.tip{position:fixed;z-index:50;pointer-events:none;background:#3A3A3C;color:#fff;font-size:13px;line-height:1.45;padding:8px 10px;border-radius:10px;max-width:240px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--series);vertical-align:middle;margin-inline-end:6px}
.legend i.ref{background:none;border-top:2px dashed var(--muted);height:0}
.empty{color:var(--muted);font-size:15px;padding:8px 0}
details.more{background:var(--card);border-radius:18px;padding:2px 16px 12px;margin-top:12px}
details.more summary{cursor:pointer;font-weight:600;padding:13px 0;color:var(--stand)}
.sh{font-size:15px;margin:14px 0 4px}
table.dt{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.dt th,table.dt td{padding:7px 4px;border-bottom:1px solid var(--sep);text-align:right}
table.dt th{color:var(--muted);font-weight:600}
table.dt td.n{direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
.matrix{width:100%;border-collapse:collapse;font-size:13px}
.matrix th,.matrix td{padding:7px 4px;border-bottom:1px solid var(--sep);text-align:right}
.matrix th{color:var(--muted);font-weight:600}
.flag{font-size:13px;color:var(--warn);font-weight:600}
.exchart{padding:4px 0 12px}
.lockcard input{width:100%;margin-top:8px;padding:12px;border-radius:12px;border:0;background:var(--card2);direction:ltr;text-align:center}

/* dash.js cards, Health-style: small coloured title, big readable content */
#progress{--series:var(--stand)}#body{--series:var(--exercise)}#food{--series:var(--move)}
.dhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px 0 6px}
.dhead h1{font-size:34px;font-weight:800}
.dcard{background:var(--card);border-radius:18px;padding:16px;margin-top:12px}
.dcard h2{font-size:15px;font-weight:600;color:var(--series);margin-bottom:2px}
.dcard .sub{font-size:14px;color:var(--muted);margin:2px 0 8px}
.summary p{margin:0 0 8px;font-size:19px;font-weight:600;line-height:1.45}
.summary p:last-child{margin:0}
.summary .num{color:var(--series)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.callout{border-radius:14px;padding:12px;background:var(--card2)}
.callout .k{font-size:13px;color:var(--muted);font-weight:600}
.callout b{display:block;font-size:17px;margin:2px 0}
.meter{display:none}

.banner{display:block;margin-top:12px}
.banner b{display:block;font-size:17px;color:var(--exercise)}
.banner span{font-size:15px;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tool{padding:6px 12px;border-radius:999px;background:var(--card2);font-size:13px;font-weight:600;color:var(--ink)}
.cues{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--card2);font-size:15px;line-height:1.55}
.adj{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 4px;padding:6px 8px;border-radius:12px;background:var(--card2);font-size:13px;color:var(--muted)}
.adj button{min-width:60px;height:38px;border-radius:10px;background:var(--card);color:var(--ink);font-weight:700;font-size:15px}
.adj b{font-size:20px;color:var(--ink);min-width:48px;text-align:center}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:60;background:var(--exercise);color:#000;font-weight:700;padding:12px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.5);white-space:nowrap}
.toast.pop{animation:pop .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:translate(-50%,-20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@media (prefers-reduced-motion:reduce){.toast.pop{animation:none}}
.fld{width:100%;font-size:16px;padding:11px 12px;border-radius:12px;border:0;background:var(--card2);color:var(--ink)}
.entry{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-top:8px}
.entry input{width:100%;padding:11px 10px;border-radius:12px;border:0;background:var(--card2);font-size:17px;text-align:center}
.syncok{color:var(--ok);font-weight:600}.syncbad{color:var(--warn);font-weight:600}
</style>
</head>
<body>
<div class="wrap">

<!-- HOME / SUMMARY -->
<section id="home">
  <div class="lt"><div><span class="date" id="todayLbl"></span><h1>الملخص</h1></div>
    <button class="ibtn" id="toSettings" aria-label="الإعدادات"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button></div>
  <button class="pill move block hidden" id="resumeBtn" style="margin-bottom:12px">كمّل التمرينة المفتوحة</button>
  <div class="card" id="ringsCard"></div>
  <div id="banners"></div>
  <div id="days"></div>
  <div id="histBox"><h2 class="sect-t">آخر التمرينات</h2><div class="grouped" id="histList"></div></div>
</section>

<!-- SESSION -->
<section id="session" class="hidden">
  <div class="shead">
    <div><div class="ttl" id="sDay"></div><div class="stat" id="status"></div></div>
    <div class="clk num" id="elapsed">0:00</div>
    <button class="pill move" id="finishBtn" style="padding:9px 16px;font-size:15px">إنهاء</button>
  </div>
  <div id="exList"></div>
  <div class="endrow">
    <button class="pill move block" id="finishBtn2">إنهاء التمرينة</button>
    <button class="lnk dim" id="restartBtn">الغي التمرينة وابدأ من الأول</button>
  </div>
</section>

<!-- SUMMARY AFTER A WORKOUT -->
<section id="summary" class="hidden">
  <div class="lt"><div><span class="date" id="sumDate"></span><h1>خلصت 💪</h1></div></div>
  <div class="stats" id="sumStats"></div>
  <h2 class="sect-t">ابعته في الشات</h2>
  <textarea id="sumText" readonly></textarea>
  <button class="pill move block" id="shareBtn" style="margin-top:12px">ابعت الملخص</button>
  <div class="row"><button class="pill gray" id="copyBtn">نسخ</button><button class="pill gray" id="editBtn">عدّل الأرقام</button></div>
  <div id="editBox" class="hidden card" style="margin-top:12px"></div>
  <div class="row"><button class="pill gray" id="homeBtn">رجوع للملخص</button></div>
  <div class="row"><button class="lnk dim" id="delSumBtn">امسح التمرينة دي من السجل</button></div>
</section>

<!-- DASHBOARD -->
<section id="progress" class="hidden"></section>
<section id="body" class="hidden"></section>
<section id="food" class="hidden"></section>

<!-- SETTINGS -->
<section id="settings" class="hidden">
  <div class="lt"><h1>الإعدادات</h1><button class="pill gray" id="backHome" style="padding:8px 18px;font-size:15px">تم</button></div>
  <div class="tabs" id="tabs"></div>
  <div id="cardioEdit" class="hidden card">
    <div class="edit">
      <div><label for="cMin">المدة بالدقايق</label><input id="cMin" type="number" inputmode="numeric"></div>
      <div><label for="cNote">ملاحظة</label><input id="cNote" type="text"></div>
    </div>
  </div>
  <div id="plansList" class="card"></div>
  <button class="pill gray block" id="addEx" style="margin-top:12px">+ ضيف تمرين</button>
  <h2 class="sect-t">نسخة احتياطية</h2>
  <div class="card">
    <p class="muted" style="margin-top:0">التمرينات المسجلة محفوظة على الموبايل ده. انسخ النسخة واحتفظ بيها، أو الصق نسخة قديمة واسترجعها.</p>
    <textarea id="backup" style="min-height:90px;direction:ltr;font-size:13px;background:var(--card2)"></textarea>
    <div class="row"><button class="pill gray" id="exportBtn">انسخ النسخة</button><button class="pill gray" id="importBtn">استرجع</button></div>
    <div class="row"><button class="pill gray" id="resetPlans">رجّع التمارين للأصل</button></div>
  </div>
  <h2 class="sect-t">البرنامج</h2>
  <div class="card"><label for="progStart">بداية البرنامج (أسبوع 1)</label><input id="progStart" type="date" class="fld">
    <p class="muted" style="margin:8px 0 0;font-size:14px">8 أسابيع: 7 زيادة وأسبوع ديلود في الآخر.</p></div>
  <h2 class="sect-t">النسخة الاحتياطية على GitHub</h2>
  <div class="card" id="syncCard"></div>
  <h2 class="sect-t">التحديثات</h2>
  <div class="card">
    <p class="muted" style="margin-top:0" id="verLbl"></p>
    <button class="pill gray block" id="hardRefresh">حدّث التطبيق دلوقتي</button>
  </div>
</section>

</div>

<!-- REST BAR -->
<div class="rest hidden" id="rest"><div class="in">
  <svg class="ring" viewBox="0 0 54 54" aria-hidden="true"><circle class="t" cx="27" cy="27" r="23"/><circle class="p" id="restP" cx="27" cy="27" r="23"/></svg>
  <div class="mid"><div class="lab" id="restLab">راحة</div><div class="cd num" id="restCd">0:00</div></div>
  <button class="rb" id="restMinus" aria-label="أقل 15 ثانية">−15</button>
  <button class="rb" id="restPlus" aria-label="زوّد 15 ثانية">+15</button>
  <button class="pill gray" id="restSkip" style="padding:10px 14px;font-size:15px;background:var(--card)">تخطّي</button>
</div></div>

<nav id="nav" class="tabbar" aria-label="الأقسام">
  <button data-v="home" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/></svg>الملخص</button>
  <button data-v="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M6 15l4-5 3 3 5-7"/></svg>التقدم</button>
  <button data-v="body"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2.2"/><path d="M12 8v6M8 10l4 1.5 4-1.5M9.5 21l2.5-7 2.5 7"/></svg>الجسم</button>
  <button data-v="food"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M16 3c-2 0-3 3-3 6s1 4 3 4v8"/></svg>الأكل</button>
</nav>
<div id="sheet" class="sheet-bg hidden"></div>
<div id="tip" class="tip hidden" role="status"></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script src="plan.js"></script>
<script src="app.js"></script>
<script src="dash.js"></script>
<script src="sync.js"></script>
</body>
</html>
